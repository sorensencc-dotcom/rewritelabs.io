name: Publish briefing

# Receives a scored briefing payload from the cloud runner (Step 8c) and opens a
# draft PR. Needs "Allow GitHub Actions to create and approve pull requests"
# enabled under Settings > Actions > General.
on:
  repository_dispatch:
    types: [publish-briefing]

permissions:
  contents: write
  pull-requests: write
  actions: write

# One run per briefing date at a time, so two dispatches for the same day cannot race on the branch.
concurrency:
  group: publish-briefing-${{ github.event.client_payload.date }}
  cancel-in-progress: false

jobs:
  create-briefing-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Write payload
        env:
          PAYLOAD_JSON: ${{ toJson(github.event.client_payload) }}
        run: printf '%s' "$PAYLOAD_JSON" > "$RUNNER_TEMP/briefing-payload.json"

      - name: Validate payload
        run: node content-site/scripts/publish-briefing.mjs "$RUNNER_TEMP/briefing-payload.json" --dry-run

      - name: Open draft PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node content-site/scripts/publish-briefing.mjs "$RUNNER_TEMP/briefing-payload.json" | tee "$RUNNER_TEMP/pr-url.txt"

      # A PR opened with GITHUB_TOKEN does not trigger the pull_request workflows, so start the site checks by hand.
      # Their result shows on the PR, and a briefing that breaks the content schema turns it red before merge.
      - name: Run site checks on the briefing branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          date=$(node -p "require(process.env.RUNNER_TEMP + '/briefing-payload.json').date")
          gh workflow run site-checks.yml --ref "briefing/$date" || echo "::warning::Could not start the site checks for briefing/$date"

      - name: Summarize
        run: echo "Draft PR $(tail -n 1 "$RUNNER_TEMP/pr-url.txt")" >> "$GITHUB_STEP_SUMMARY"
