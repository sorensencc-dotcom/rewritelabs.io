name: Auto-merge briefing

# Merges a daily AI-news briefing PR once the Site checks pass, so the feed
# publishes with no human in the loop. Only briefing PRs are ever merged
# here: one new file under content-site/src/content/briefings/. Anything
# else fails closed and stays open for a human.
#
# Triggered by completion of the Site checks workflow. A workflow_run
# workflow runs from main, so this file must be merged to main before it
# takes effect. The Publish briefing workflow starts the site checks by
# hand for briefing PRs, because PRs opened with GITHUB_TOKEN do not
# trigger pull_request workflows.
on:
  workflow_run:
    workflows: ["Site checks"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge-briefing:
    # Only successful Site checks runs, on a briefing branch.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'briefing/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Find the briefing PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          pr_number=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr_number" ]; then
            echo "No open PR for $BRANCH (already merged or closed); nothing to do."
            echo "number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Check the PR is exactly one new briefing file, at the checked commit
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          date="${BRANCH#briefing/}"
          if ! [[ "$date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::Branch $BRANCH is not a dated briefing branch; refusing to merge PR #$PR_NUMBER."
            exit 1
          fi
          pr_sha=$(gh pr view "$PR_NUMBER" --json headRefOid --jq '.headRefOid')
          if [ "$pr_sha" != "$HEAD_SHA" ]; then
            echo "::error::PR #$PR_NUMBER head $pr_sha is not the commit the checks ran on ($HEAD_SHA); refusing to merge."
            exit 1
          fi
          files=$(gh pr view "$PR_NUMBER" --json files --jq '.files[].path')
          expected="content-site/src/content/briefings/$date.md"
          if [ "$files" != "$expected" ]; then
            echo "::error::PR #$PR_NUMBER changes files other than $expected; refusing to merge."
            echo "Changed files: $files"
            exit 1
          fi
          echo "PR #$PR_NUMBER is a single-file briefing for $date at the checked commit; safe to merge."

      - name: Mark ready and merge
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          # Draft PRs cannot be merged. Marking ready is the point of no
          # return, and it only happens after the site checks passed and
          # the scope check above.
          is_draft=$(gh pr view "$PR_NUMBER" --json isDraft --jq '.isDraft')
          if [ "$is_draft" = "true" ]; then
            gh pr ready "$PR_NUMBER"
          fi
          gh pr merge "$PR_NUMBER" --merge --delete-branch
