version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: discovery_postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: discovery
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7
    container_name: discovery_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]

  ai:
    build: ../ai
    container_name: discovery_ai
    restart: always
    environment:
      GEMMA_API_KEY: ${GEMMA_API_KEY}
    ports:
      - "4020:4020"