<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Rewrite Labs Operator Console</title>
<link rel="stylesheet" href="operator-clean.css" />
<link rel="stylesheet" href="rl-theme.css" />
<link rel="stylesheet" href="rl-global.css" />
<link rel="stylesheet" href="rl-components.css" />
<link rel="stylesheet" href="rl-os.css" />

<script src="ui.js" defer></script>

</head>

<body>
  <div class="rl-os-scanlines"></div>
  <div class="rl-os-sweep"></div>

    <div class="rl-grid rl-grid-2" style="margin-top: 24px;">
      <div class="rl-panel">
        <h2>OSM Engine</h2>
        <div id="osm-status">Loading...</div>
      </div>

      <div class="rl-panel">
        <h2>Global Sweeper</h2>

    <div class="rl-panel" style="margin-top: 24px;">
      <h2>Recent Logs</h2>
      <div id="logs">Loading...</div>
    </div>
  </div>
